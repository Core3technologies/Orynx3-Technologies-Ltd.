<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>App 1 - Orynx3 Technologies</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* BACKGROUND GLOW */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: #2563eb;
      filter: blur(150px);
      opacity: 0.25;
      top: -200px;
      left: -200px;
      border-radius: 50%;
    }

    .box {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 16px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      transition: 0.3s ease;
    }

    /* HOVER / CURSOR EFFECT */
    .box:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 60px rgba(37, 99, 235, 0.3);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
    }

    ul {
      text-align: left;
      margin-top: 15px;
      opacity: 0.9;
    }

    /* DOWNLOAD GRID */
    .downloads {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 25px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .windows {
      background: #2563eb;
      color: white;
    }

    .apple {
      background: #111827;
      color: white;
    }

    .mobile {
      background: #10b981;
      color: white;
    }

    .manual {
      background: #f59e0b;
      color: black;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .status {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
    }

  </style>

</head>

<body>

  <div class="box">

    <h1>Elara CORE.3</h1>

    <p>
      Next-generation AI assistant built for productivity, learning, and automation.
    </p>

    <h3>Features:</h3>
    <ul>
      <li>Voice command, listens you incessantly</li>
      <li>Smart Assistant can do anything</li>
      <li>Gives you what you want</li>
    </ul>

    <!-- DOWNLOAD OPTIONS -->
    <div class="downloads">

      <button class="btn windows">
        Download for Windows
      </button>

      <button class="btn apple">
        Download Manual for Windows
      </button>

      <button class="btn mobile">
        Download for Mobile
      </button>

      <button class="btn manual">
        Download Manual for Mobile
      </button>

    </div>

    <div class="status">
      Coming soon • Orynx3 Technologies Ltd
    </div>

  </div>

</body>

</html>
